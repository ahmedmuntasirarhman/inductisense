name: Verify InductiSense

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Analysis and portable firmware core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate synthetic benchmark
        run: python analysis/train_demo.py --out /tmp/condition-map.png --metrics /tmp/demo_metrics.json
      - name: Compile and run portable C++ tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -pedantic -Ifirmware/include
          firmware/src/SignalFeatures.cpp firmware/src/ConditionModel.cpp
          firmware/test/test_signal_features.cpp -o /tmp/firmware-test
          && /tmp/firmware-test
